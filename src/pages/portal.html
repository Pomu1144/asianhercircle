<header class="page-head">
  <div class="container">
    <p class="label">Members</p>
    <h1>Member login</h1>
    <p>Your profile, connections, messages, groups, event registrations and saved resources in one place.</p>
  </div>
</header>

<section class="section">
  <div class="container row">
    <p class="label">Sign in</p>
    <div>
      <form class="form" style="max-width:420px" data-demo>
        <div class="field"><label for="l-email">Email</label><input id="l-email" type="email" name="email" required autocomplete="email"></div>
        <div class="field"><label for="l-password">Password</label><input id="l-password" type="password" name="password" required autocomplete="current-password"></div>
        <div><button class="btn" type="submit">Sign in</button></div>
        <p class="form-success" role="status">The member area isn&rsquo;t open yet. We&rsquo;ll email members when it launches.</p>
      </form>
      <p class="muted" style="margin-top:2rem">Not a member yet? <a href="membership.html#join">Apply to join</a>.</p>
    </div>
  </div>
</section>
