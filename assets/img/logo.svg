<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Her Circle">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D2FA3"/>
      <stop offset=".45" stop-color="#51217D"/>
      <stop offset=".75" stop-color="#074787"/>
      <stop offset="1" stop-color="#0876C9"/>
