  <line x1="46" y1="137" x2="62" y2="137" stroke="#51217D" stroke-width="2"/>
  <line x1="138" y1="137" x2="154" y2="137" stroke="#51217D" stroke-width="2"/>
  <text x="100" y="142" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-weight="600" font-size="14" fill="#51217D" letter-spacing="4">CIRCLE</text>
